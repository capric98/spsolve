[project]
name = "spsolve"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "numpy >= 2.0.0",
    "scipy >= 1.15.0",
]

description = "Native sparse LU and triangular solvers for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "capric98" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
]


[project.urls]
Homepage = "https://github.com/capric98/spsolve"


[build-system]
requires = [
    "nanobind >=2.8.0",
    "scikit-build-core >= 0.11.5",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Tells scikit-build-core where to find the Python package source
wheel.packages = ["src/spsolve"]
wheel.license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "third_party/suitesparse_ordering/LICENSE-*.txt",
]


[tool.cibuildwheel]
build-verbosity = 1
test-command = "python -m unittest discover -v -s {project}/tests -t {project}"
