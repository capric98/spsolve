name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} py${{ matrix.python }} kernel=${{ matrix.kernel }} ${{ matrix.build_args }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default kernel selection (avx2-fma where the runner supports it).
          - { os: ubuntu-latest, python: "3.14", kernel: auto }
          - { os: windows-latest, python: "3.14", kernel: auto }
          # The baseline kernel on the same runners.
          - { os: ubuntu-latest, python: "3.14", kernel: sse2 }
          - { os: windows-latest, python: "3.14", kernel: sse2 }
          # A build without the AVX2 translation unit.
          - { os: ubuntu-latest, python: "3.14", kernel: auto, build_args: "-Ccmake.define.SP_ENABLE_AVX2=OFF" }
    runs-on: ${{ matrix.os }}
    env:
      SPSOLVE_FORCE_KERNEL: ${{ matrix.kernel }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build and install
        run: python -m pip install . ${{ matrix.build_args }}
      - name: Report dense kernels
        run: python -c "from spsolve.spparms import get_dense_kernel, available_dense_kernels; print(get_dense_kernel(), available_dense_kernels())"
      - name: Test installed package
        run: python -m unittest discover -v -s tests -t .
      - name: Benchmark smoke test
        run: python benchmarks/factorization.py --quick --repeats 1 --warmups 0
